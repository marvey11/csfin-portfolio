name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'yarn'

      - run: yarn install --frozen-lockfile

      # Runs lint, test, and build targets for affected projects in parallel
      - name: Run affected commands
        run: npx run-many --target=lint --target=test --target=build --parallel=3
